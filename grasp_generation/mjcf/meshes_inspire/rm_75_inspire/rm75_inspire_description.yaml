# The robot description defines the generalized coordinates and how to map those
# to the underlying URDF dofs.

api_version: 1.0

# Defines the generalized coordinates. Each generalized coordinate is assumed
# to have an entry in the URDF.
# Lula will only use these joints to control the robot position.
cspace:
    - rm75_link_1
    - rm75_link_2
    - rm75_link_3
    - rm75_link_4
    - rm75_link_5
    - rm75_link_6
    - rm75_link_7

default_q: [
    0.00, -1.3, 0.00, -2.87, 0.00, 2.00, 0.75
]

acceleration_limits: [15.0, 7.5, 10.0, 12.5, 15.0, 20.0, 20.0]
jerk_limits: [7500.0, 3750.0, 5000.0, 6250.0, 7500.0, 10000.0, 10000.0]

# Most dimensions of the cspace have a direct corresponding element
# in the URDF. This list of rules defines how unspecified coordinates
# should be extracted or how values in the URDF should be overwritten.
cspace_to_urdf_rules:
    - {name: thumb_proximal_yaw_joint, rule: fixed, value: 0.0}
    - {name: thumb_proximal_pitch_joint, rule: fixed, value: 0.0}
    - {name: thumb_intermediate_joint, rule: fixed, value: 0.0}
    - {name: thumb_distal_joint, rule: fixed, value: 0.0}
    - {name: index_proximal_joint, rule: fixed, value: 0.0}
    - {name: index_intermediate_joint, rule: fixed, value: 0.0}
    - {name: middle_proximal_joint, rule: fixed, value: 0.0}
    - {name: middle_intermediate_joint, rule: fixed, value: 0.0}
    - {name: ring_proximal_joint, rule: fixed, value: 0.0}
    - {name: ring_intermediate_joint, rule: fixed, value: 0.0}
    - {name: pinky_proximal_joint, rule: fixed, value: 0.0}
    - {name: pinky_intermediate_joint, rule: fixed, value: 0.0}

collision_spheres:
    - arm_base:
        - "center": [0.0, 0.0, 0.05]
          "radius": 0.045
    - rm75_link_1:
